autoDedupe: true

autoInstallPeers: false

color: always

engineStrict: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@standard-config/*'

overrides:
  '@prettier/plugin-oxc': '-'

permissions:
  simple-git-hooks:
    build: true

strictPeerDependencies: true

trustPolicy: no-downgrade
